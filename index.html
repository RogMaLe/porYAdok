<script>
"use strict";
var THR=30, MINFRAC=0.0025, DW=800, B=16, SB=16;
function $(id){return document.getElementById(id);}
var refC=null,curC=null,zones=[],eviZone=-1,srcMode="cam";
var lastBoxes=null,lastRefD=null,lastCurD=null,lastF=1,showRef=false,stream=null,hintTimer=null,rafId=null,shotDone=false;
var prevCan=null,prevMode=null,prevRe=null,visRot=0,visZoom=1,camIdx=0,ghostCan=null;
var lastMask=null,lastMW=0,lastMH=0,lastInfo=0;

function fileToImage(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f);var im=new Image();im.onload=function(){res(im);};im.onerror=rej;im.src=u;});}
function toCanvas(src,maxW){var w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;var s=Math.min(1,maxW/w);var c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c;}
function grayOf(c){var d=c.getContext("2d").getImageData(0,0,c.width,c.height).data;var g=new Float32Array(c.width*c.height);for(var i=0,p=0;i<d.length;i+=4,p++){g[p]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];}return g;}
function grayAt(c,W,H){var t=document.createElement("canvas");t.width=W;t.height=H;t.getContext("2d").drawImage(c,0,0,W,H);return grayOf(t);}
function status(t){$("status").textContent=t;}
function rot90(c,cw){var o=document.createElement("canvas");o.width=c.height;o.height=c.width;var x=o.getContext("2d");x.translate(o.width/2,o.height/2);x.rotate(cw?Math.PI/2:-Math.PI/2);x.drawImage(c,-c.width/2,-c.height/2);return o;}
function coverDraw(ctx,src,W,H){var s=Math.max(W/src.width,H/src.height);var dw=src.width*s,dh=src.height*s;ctx.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);}
function coverCrop(c,aspectWH){
 var cw=c.width,ch=c.height,ca=cw/ch,sw,sh;
 if(ca>aspectWH){sh=ch;sw=ch*aspectWH;}else{sw=cw;sh=cw/aspectWH;}
 var o=document.createElement("canvas");o.width=Math.max(2,Math.round(sw));o.height=Math.max(2,Math.round(sh));
 o.getContext("2d").drawImage(c,(cw-sw)/2,(ch-sh)/2,sw,sh,0,0,o.width,o.height);
 return o;
}

function showPreview(im,mode,reopen){
 prevCan=toCanvas(im,1200);prevMode=mode;prevRe=reopen;
 drawPrev();
 $("prev").style.display="flex";
}
function drawPrev(){
 var p=$("pcan");p.width=prevCan.width;p.height=prevCan.height;
 p.getContext("2d").drawImage(prevCan,0,0);
 $("porient").textContent="Ориентация: "+(prevCan.height>prevCan.width?"вертикальная":"горизонтальная");
}
function setRefCanvas(c){refC=c;try{localStorage.setItem("poryadok_ref",toCanvas(c,1024).toDataURL("image/jpeg",0.85));}catch(e){}status("Эталон сохранён. Теперь «2. Проверка». Источник: "+(srcMode==="cam"?"камера":"память")+".");}
function setCurCanvas(c){curC=c;status("Проверка получена. Жмите «Сравнить».");}

function search(rg,cg,W,H,ss,rr,tx0,tx1,tsx,ty0,ty1,tsy){
 var CX=W/2,CY=H/2,lim=W*H,best={s:1,r:0,tx:0,ty:0,score:Infinity};
 for(var si=0;si<ss.length;si++)for(var ri=0;ri<rr.length;ri++)
  for(var tx=tx0;tx<=tx1;tx+=tsx)for(var ty=ty0;ty<=ty1;ty+=tsy){
   var a=rr[ri]*Math.PI/180,co=Math.cos(a),sin=Math.sin(a);
   var A00=ss[si]*co,A01=-ss[si]*sin,A10=ss[si]*sin,A11=ss[si]*co;
   var b0=CX-(A00*CX+A01*CY)+tx,b1=CY-(A10*CX+A11*CY)+ty;
   var sum=0,cnt=0;
   for(var y=0;y<H;y++)for(var x=0;x<W;x++){
    var dx=x-CX,dy=y-CY;
    var px=Math.round(A00*dx+A01*dy+b0),py=Math.round(A10*dx+A11*dy+b1);
    if(px<0||py<0||px>=W||py>=H)continue;
    sum+=Math.abs(cg[py*W+px]-rg[y*W+x]);cnt++;
   }
   if(cnt<0.6*lim)continue;
   var sc=sum/cnt;
   if(sc<best.score)best={s:ss[si],r:rr[ri],tx:tx,ty:ty,score:sc};
  }
 return best;
}
function findAlign(rC,cC){
 var LW=96,LH=Math.max(48,Math.round(96*rC.height/rC.width));
 var rg=grayAt(rC,LW,LH),cg=grayAt(cC,LW,LH);
 var b1=search(rg,cg,LW,LH,[0.85,0.92,1.0,1.08,1.15],[-6,-3,0,3,6],-16,16,4,-12,12,3);
 if(b1.score===Infinity)return{s:1,r:0,txu:0,tyu:0,score:Infinity};
 var L2=192,H2=Math.round(L2*LH/LW);
 var rg2=grayAt(rC,L2,H2),cg2=grayAt(cC,L2,H2);
 var b2=search(rg2,cg2,L2,H2,[b1.s-0.02,b1.s,b1.s+0.02],[b1.r-1.5,b1.r,b1.r+1.5],Math.round(b1.tx*2)-4,Math.round(b1.tx*2)+4,2,Math.round(b1.ty*2)-4,Math.round(b1.ty*2)+4,2);
 return{s:b2.s,r:b2.r,txu:b2.tx/L2,tyu:b2.ty/L2,score:b2.score};
}
function blockCompare(g1,g2,W,H,al){
 var GW=Math.floor(W/B),GH=Math.floor(H/B);
 var mask=new Uint8Array(GW*GH),info=0,changed=0;
 var T=THR*0.7;
 var a=al?al.r*Math.PI/180:0,co=Math.cos(a),si=Math.sin(a),s=al?al.s:1;
 var b0x=al?al.txu*W:0,b0y=al?al.tyu*H:0;
 var CX=W/2,CY=H/2;
 var A00=s*co,A01=-s*si,A10=s*si,A11=s*co;
 var mx=CX-(A00*CX+A01*CY)+b0x,my=CY-(A10*CX+A11*CY)+b0y;
 for(var by=0;by<GH;by++)for(var bx=0;bx<GW;bx++){
  var x0=bx*B,y0=by*B,i,j;
  var mR=0,cnt=B*B;
  for(j=0;j<B;j++)for(i=0;i<B;i++){mR+=g1[(y0+j)*W+(x0+i)];}
  mR/=cnt;
  var mad=0;
  for(j=0;j<B;j++)for(i=0;i<B;i++){mad+=Math.abs(g1[(y0+j)*W+(x0+i)]-mR);}
  mad/=cnt;
  if(mad<5)continue;
  info++;
  var cxm=x0+B/2,cym=y0+B/2;
  var dx0=Math.round(A00*cxm+A01*cym+mx-cxm);
  var dy0=Math.round(A10*cxm+A11*cym+my-cym);
  var best=Infinity;
  for(var dy=dy0-6;dy<=dy0+6;dy+=2)for(var dx=dx0-6;dx<=dx0+6;dx+=2){
   var sx=x0+dx,sy=y0+dy;
   if(sx<0||sy<0||sx+B>W||sy+B>H)continue;
   var mC=0;
   for(j=0;j<B;j++)for(i=0;i<B;i++){mC+=g2[(sy+j)*W+(sx+i)];}
   mC/=cnt;
   var r=0;
   for(j=0;j<B;j++)for(i=0;i<B;i++){r+=Math.abs((g1[(y0+j)*W+(x0+i)]-mR)-(g2[(sy+j)*W+(sx+i)]-mC));}
   r/=cnt;
   if(r<best)best=r;
  }
  if(best===Infinity)best=T+1;
  if(best>T){mask[by*GW+bx]=1;changed++;}
 }
 lastInfo=info>0?changed/info:0;
 return{mask:mask,GW:GW,GH:GH};
}
function computeShifts(refG,fr){
 var LW=160;
 var Hr=Math.max(32,Math.round(LW*refG.height/refG.width));
 var Hc=Math.max(32,Math.round(LW*fr.height/fr.width));
 var R=grayAt(refG,LW,Hr),C=grayAt(fr,LW,Hc);
 var GW=Math.floor(LW/SB),GH=Math.floor(Math.min(Hr,Hc)/SB);
 var shx=new Float32Array(GW*GH),shy=new Float32Array(GW*GH),ok=new Uint8Array(GW*GH);
 var xs=[],ys=[];
 for(var by=0;by<GH;by++)for(var bx=0;bx<GW;bx++){
  var x0=bx*SB,y0=by*SB,i,j;
  var mR=0,cnt=SB*SB;
  for(j=0;j<SB;j++)for(i=0;i<SB;i++){mR+=R[(y0+j)*LW+(x0+i)];}
  mR/=cnt;
  var mad=0;
  for(j=0;j<SB;j++)for(i=0;i<SB;i++){mad+=Math.abs(R[(y0+j)*LW+(x0+i)]-mR);}
  mad/=cnt;
  if(mad<5)continue;
  var best=Infinity,bdx=0,bdy=0;
  for(var dy=-10;dy<=10;dy+=2)for(var dx=-10;dx<=10;dx+=2){
   var sx=x0+dx,sy=y0+dy;
   if(sx<0||sy<0||sx+SB>LW||sy+SB>Hc)continue;
   var mC=0;
   for(j=0;j<SB;j++)for(i=0;i<SB;i++){mC+=C[(sy+j)*LW+(sx+i)];}
   mC/=cnt;
   var r=0;
   for(j=0;j<SB;j++)for(i=0;i<SB;i++){r+=Math.abs((R[(y0+j)*LW+(x0+i)]-mR)-(C[(sy+j)*LW+(sx+i)]-mC));}
   r/=cnt;
   if(r<best){best=r;bdx=dx;bdy=dy;}
  }
  if(best<25){ok[by*GW+bx]=1;shx[by*GW+bx]=bdx;shy[by*GW+bx]=bdy;xs.push(bdx);ys.push(bdy);}
 }
 var medx=0,medy=0;
 if(xs.length){xs.sort(function(a,b){return a-b;});ys.sort(function(a,b){return a-b;});medx=xs[xs.length>>1];medy=ys[ys.length>>1];}
 return{shx:shx,shy:shy,ok:ok,GW:GW,GH:GH,medx:medx,medy:medy,okf:xs.length/(GW*GH),LW:LW,Hr:Hr,Hc:Hc};
}
function renderGhost(gcan,W,H,fr,refG,sh){
 var ctx=gcan.getContext("2d");
 ctx.clearRect(0,0,W,H);
 var sL=Math.max(W/fr.width,H/fr.height);
 var offXL=(W-fr.width*sL)/2,offYL=(H-fr.height*sL)/2;
 var kx=fr.width/sh.LW,ky=fr.height/sh.Hc;
 var gsx=refG.width/sh.LW,gsy=refG.height/sh.Hr;
 for(var by=0;by<sh.GH;by++)for(var bx=0;bx<sh.GW;bx++){
  var idx=by*sh.GW+bx;
  var dx=sh.ok[idx]?sh.shx[idx]:sh.medx;
  var dy=sh.ok[idx]?sh.shy[idx]:sh.medy;
  var destX=offXL+(bx*SB+dx)*kx*sL;
  var destY=offYL+(by*SB+dy)*ky*sL;
  var destW=SB*kx*sL+1,destH=SB*ky*sL+1;
  var srcX=bx*SB*gsx,srcY=by*SB*gsy,srcW=SB*gsx+1,srcH=SB*gsy+1;
  ctx.drawImage(refG,srcX,srcY,srcW,srcH,destX,destY,destW,destH);
 }
}
function componentsBlocks(mask,GW,GH,minBlocks){
 var seen=new Uint8Array(GW*GH),out=[],stack=[];
 for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
  var idx=y*GW+x;
  if(!mask[idx]||seen[idx])continue;
  stack.length=0;stack.push(idx);seen[idx]=1;
  var minx=x,maxx=x,miny=y,maxy=y,area=0;
  while(stack.length){
   var p=stack.pop(),px=p%GW,py=(p/GW)|0;area++;
   if(px<minx)minx=px;if(px>maxx)maxx=px;if(py<miny)miny=py;if(py>maxy)maxy=py;
   for(var d=0;d<4;d++){
    var nx=px+(d===0?1:d===1?-1:0),ny=py+(d===2?1:d===3?-1:0);
    if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
    var ni=ny*GW+nx;
    if(mask[ni]&&!seen[ni]){seen[ni]=1;stack.push(ni);}
   }
  }
  if(area>=minBlocks)out.push({x:minx,y:miny,w:maxx-minx+1,h:maxy-miny+1,area:area});
 }
 return out;
}
function thumb(src,box,f){
 var c=document.createElement("canvas");
 var sw=box.w*f,sh=box.h*f,sx=box.x*f,sy=box.y*f;
 var tw=150,th=Math.max(40,Math.min(260,Math.round(150*sh/sw)));
 c.width=tw;c.height=th;
 c.getContext("2d").drawImage(src,sx,sy,sw,sh,0,0,tw,th);
 return c;
}
function drawView(){
 if(!lastRefD||!lastCurD)return;
 var view=$("view"),ctx=view.getContext("2d");
 if(showRef){ctx.drawImage(lastRefD,0,0);$("vcap").textContent="Кадр 1 (эталон). Свайп или тап — вернуться к результату.";}
 else{
  ctx.drawImage(lastCurD,0,0);
  for(var i=0;i<lastBoxes.length;i++){
   var b=lastBoxes[i];
   ctx.strokeStyle=b.edge?"#e67e22":"#ff2222";ctx.lineWidth=4;
   ctx.strokeRect(b.x*lastF,b.y*lastF,b.w*lastF,b.h*lastF);
   ctx.fillStyle=b.edge?"#e67e22":"#ff2222";ctx.font="bold 34px sans-serif";
   ctx.fillText(String(i+1),b.x*lastF+6,Math.max(34,b.y*lastF+34));
  }
  $("vcap").textContent="Кадр 2 с зонами. Свайп или тап — показать эталон.";
 }
}
function compare(){
 if(!refC){status("Сначала задайте эталон: кнопка «1. Эталон».");return;}
 if(!curC){status("Сначала получите проверку: кнопка «2. Проверка».");return;}
 status("Сравниваю… секундочку.");
 setTimeout(function(){
  try{
   var refWH=refC.width/refC.height;
   var curWork=coverCrop(curC,refWH);
   var refAspect=refC.height/refC.width;
   var curAspect=curWork.height/curWork.width;
   if((refAspect>1)!==(curAspect>1)){
    var c1=coverCrop(rot90(curC,true),refWH),c2=coverCrop(rot90(curC,false),refWH);
    var a1=findAlign(refC,c1),a2=findAlign(refC,c2);
    if(a1.score<=a2.score)curWork=c1;else curWork=c2;
   }
   var al=findAlign(refC,curWork);
   if(al.score===Infinity)al=null;
   var MW=320,MH=Math.round(MW*refAspect);
   var g1=grayAt(refC,MW,MH);
   var g2=grayAt(curWork,MW,MH);
   var m1=0,m2=0,i;
   for(i=0;i<g1.length;i++){m1+=g1[i];m2+=g2[i];}
   m1/=g1.length;m2/=g2.length;
   var s1=0,s2=0;
   for(i=0;i<g1.length;i++){s1+=(g1[i]-m1)*(g1[i]-m1);s2+=(g2[i]-m2)*(g2[i]-m2);}
   s1=Math.sqrt(s1/g1.length);s2=Math.sqrt(s2/g2.length);
   for(i=0;i<g2.length;i++){g2[i]=Math.max(0,Math.min(255,(g2[i]-m2)*(s1/Math.max(s2,0.001))+m1));}
   var bc=blockCompare(g1,g2,MW,MH,al);
   lastMask=bc.mask;lastMW=bc.GW;lastMH=bc.GH;
   var bl=componentsBlocks(bc.mask,bc.GW,bc.GH,2);
   var boxes=[];
   for(i=0;i<bl.length;i++){
    var bb=bl[i];
    var box={x:bb.x*B,y:bb.y*B,w:bb.w*B,h:bb.h*B,area:bb.area};
    box.edge=(box.x<=1||box.y<=1||box.x+box.w>=MW-2||box.y+box.h>=MH-2);
    boxes.push(box);
   }
   boxes.sort(function(a,b){return b.area-a.area;});
   lastCurD=toCanvas(curWork,DW);
   lastRefD=toCanvas(refC,DW);
   lastBoxes=boxes;lastF=DW/MW;showRef=false;
   var view=$("view");view.width=DW;view.height=Math.round(DW*refAspect);
   drawView();
   zones=[];$("zones").innerHTML="";
   for(var zi=0;zi<boxes.length;zi++)addZone(zi+1,boxes[zi],lastRefD,lastCurD,lastF);
   if(boxes.length===0)status("Изменений не найдено. Порядок идеальный.");
   else status("Зон изменений: "+boxes.length+". Ниже — было/стало по каждой.");
  }catch(e){status("Ошибка сравнения: "+e.message);}
 },60);
}
function addZone(n,b,refD,curD,f){
 var div=document.createElement("div");div.className="zone"+(b.edge?" edge":"");
 var t=document.createElement("div");t.className="t";t.textContent="Зона "+n+": изменено"+(b.edge?" (у края кадра)":"");
 var pair=document.createElement("div");pair.className="pair";
 var f1=document.createElement("figure");f1.appendChild(thumb(refD,b,f));var c1=document.createElement("figcaption");c1.textContent="было (эталон)";f1.appendChild(c1);
 var f2=document.createElement("figure");f2.appendChild(thumb(curD,b,f));var c2=document.createElement("figcaption");c2.textContent="стало";f2.appendChild(c2);
 pair.appendChild(f1);pair.appendChild(f2);
 var btn=document.createElement("button");btn.textContent="Приложить вещдок";
 btn.onclick=function(){eviZone=n-1;$("fEvi").click();};
 var evi=document.createElement("div");evi.className="evi";
 div.appendChild(t);div.appendChild(pair);div.appendChild(btn);div.appendChild(evi);
 $("zones").appendChild(div);
 zones.push({el:div,t:t});
}
function buildReport(){
 if(!lastRefD||!lastCurD){status("Сначала сделайте сравнение, потом отчёт.");return;}
 var W=720,pad=10,y=pad;
 var tmp=document.createElement("canvas");tmp.width=W;tmp.height=2600;
 var ctx=tmp.getContext("2d");
 ctx.fillStyle="#111";ctx.fillRect(0,0,W,2600);
 ctx.fillStyle="#ffd76a";ctx.font="bold 22px sans-serif";
 ctx.fillText("ПорЯдок 2.6, строгость "+THR+", зон: "+(lastBoxes?lastBoxes.length:0),pad,y+22);y+=34;
 ctx.fillText("изменённых информативных блоков: "+(lastInfo*100).toFixed(1)+"%",pad,y+18);y+=40;
 function section(c,label){
  var h=Math.round(W*c.height/c.width);
  ctx.fillStyle="#fff";ctx.font="bold 18px sans-serif";ctx.fillText(label,pad,y+14);y+=20;
  ctx.drawImage(c,0,0,c.width,c.height,pad,y,W,h);y+=h+pad;
 }
 section(lastRefD,"ЭТАЛОН");
 section(lastCurD,"ПРОВЕРКА");
 if(lastMask){
  var mc=document.createElement("canvas");mc.width=lastMW;mc.height=lastMH;
  var md=mc.getContext("2d").createImageData(lastMW,lastMH);
  for(var i=0;i<lastMask.length;i++){var v=lastMask[i]?255:0;md.data[i*4]=v;md.data[i*4+1]=v;md.data[i*4+2]=v;md.data[i*4+3]=255;}
  mc.getContext("2d").putImageData(md,0,0);
  ctx.fillStyle="#fff";ctx.font="bold 18px sans-serif";ctx.fillText("МАСКА ИЗМЕНЕНИЙ (белое = тревога)",pad,y+14);y+=20;
  var hm=Math.round(W*lastMH/lastMW);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(mc,0,0,lastMW,lastMH,pad,y,W,hm);y+=hm+pad;
 }
 var fin=document.createElement("canvas");fin.width=W;fin.height=y;
 fin.getContext("2d").drawImage(tmp,0,0);
 $("repimg").src=fin.toDataURL("image/jpeg",0.8);
 $("rep").style.display="flex";
}
function stopVisor(){
 if(hintTimer){clearInterval(hintTimer);hintTimer=null;}
 if(rafId){cancelAnimationFrame(rafId);rafId=null;}
 if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
 $("visor").style.display="none";
}
function grabFrame(){
 var vid=$("vidEl");
 var vw=vid.videoWidth,vh=vid.videoHeight;
 if(!vw)return null;
 var tmp=document.createElement("canvas");tmp.width=vw;tmp.height=vh;
 tmp.getContext("2d").drawImage(vid,0,0);
 var z=visZoom;
 var cw=vw/z,ch=vh/z;
 var rot=visRot%4,swap=rot%2===1;
 var cr=document.createElement("canvas");
 cr.width=swap?Math.round(ch):Math.round(cw);
 cr.height=swap?Math.round(cw):Math.round(ch);
 var cx=cr.getContext("2d");
 cx.translate(cr.width/2,cr.height/2);
 cx.rotate(rot*Math.PI/2);
 cx.drawImage(tmp,(vw-cw)/2,(vh-ch)/2,cw,ch,-cw/2,-ch/2,cw,ch);
 return cr;
}
function doShot(){
 var fr=grabFrame();
 if(!fr)return;
 curC=toCanvas(fr,1200);
 stopVisor();
 status("Проверка получена. Сравниваю…");
 compare();
}
function ghostRef(fr){
 var refHW=refC.height/refC.width;
 var frHW=fr.height/fr.width;
 if((refHW>1)!==(frHW>1))return rot90(refC,true);
 return refC;
}
function startVisor(devId){
 if(!refC){status("Сначала задайте эталон.");return;}
 shotDone=false;ghostCan=null;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status("Визир недоступен здесь, снимаю обычно.");$("fCurCam").click();return;}
 var cons=devId?{deviceId:{exact:devId}}:{facingMode:{ideal:"environment"}};
 navigator.mediaDevices.getUserMedia({video:cons}).then(function(st){
  stream=st;
  var vid=$("vidEl");vid.srcObject=st;
  $("visor").style.display="flex";
  var live=$("live"),ovl=$("ovl"),wrap=$("vwrap");
  var fit=function(){
   if(live.width!==wrap.clientWidth||live.height!==wrap.clientHeight){
    live.width=wrap.clientWidth;live.height=wrap.clientHeight;
    ovl.width=wrap.clientWidth;ovl.height=wrap.clientHeight;
    ghostCan=document.createElement("canvas");ghostCan.width=ovl.width;ghostCan.height=ovl.height;
   }
  };
  fit();
  var loop=function(){
   fit();
   var fr=grabFrame();
   var lctx=live.getContext("2d");
   lctx.fillStyle="#000";lctx.fillRect(0,0,live.width,live.height);
   if(fr)coverDraw(lctx,fr,live.width,live.height);
   var octx=ovl.getContext("2d");
   octx.clearRect(0,0,ovl.width,ovl.height);
   if(fr&&ghostCan){
    octx.globalAlpha=$("alpha").value/100;
    octx.drawImage(ghostCan,0,0);
    octx.globalAlpha=1;
   }
   rafId=requestAnimationFrame(loop);
  };
  loop();
  hintTimer=setInterval(function(){
   var h=$("hint");
   var fr=grabFrame();
   if(!fr||!ghostCan)return;
   var refG=ghostRef(fr);
   var sh=computeShifts(refG,fr);
   renderGhost(ghostCan,ghostCan.width,ghostCan.height,fr,refG,sh);
   var parts=[];
   if(sh.okf<0.15){h.className="";h.textContent="Наведите на ту же сцену";return;}
   if(sh.medx>1.5)parts.push("→ право");else if(sh.medx<-1.5)parts.push("← лево");
   if(sh.medy>1.5)parts.push("↓ низ");else if(sh.medy<-1.5)parts.push("↑ верх");
   if(parts.length===0){h.className="good";h.textContent="✓ совмещено, снимайте!";if($("autoshot").checked&&!shotDone){shotDone=true;doShot();}}
   else{h.className="";h.textContent=parts.join(", ");}
  },700);
  $("bShot").onclick=doShot;
  $("bCancel").onclick=function(){stopVisor();status("Визир отменён. Источник: "+(srcMode==="cam"?"камера":"память")+".");};
 }).catch(function(){
  status("Камера не открылась визиром, снимаю обычно.");
  $("fCurCam").click();
 });
}
$("fEvi").onchange=function(){
 var f=this.files[0];this.value="";
 if(f==null||eviZone<0||!zones[eviZone])return;
 var z=zones[eviZone];
 fileToImage(f).then(function(im){
  var img=document.createElement("img");img.src=toCanvas(im,400).toDataURL("image/jpeg",0.8);
  var cap=document.createElement("div");cap.className="cap";cap.textContent="вещдок приложен: обстоятельство объяснено";
  z.el.classList.add("ok");
  z.t.textContent=z.t.textContent.replace("изменено","объяснено");
  var evi=z.el.querySelector(".evi");evi.appendChild(img);evi.appendChild(cap);
  status("Зона "+(eviZone+1)+" помечена как объяснённая.");
 });
};
$("bPrevRot").onclick=function(){if(prevCan){prevCan=rot90(prevCan,true);drawPrev();}};
$("bPrevOk").onclick=function(){
 $("prev").style.display="none";
 var c=prevCan,m=prevMode;prevCan=null;
 if(!c)return;
 if(m==="ref")setRefCanvas(c);else setCurCanvas(c);
};
$("bPrevRe").onclick=function(){
 $("prev").style.display="none";
 var r=prevRe;prevCan=null;
 if(r)r();
};
$("bRef").onclick=function(){(srcMode==="cam"?$("fRefCam"):$("fRefMem")).click();};
$("bCur").onclick=function(){if(srcMode==="cam")startVisor(null);else $("fCurMem").click();};
$("bGo").onclick=compare;
$("bRep").onclick=buildReport;
$("bRepClose").onclick=function(){$("rep").style.display="none";};
$("bSrc").onclick=function(){srcMode=srcMode==="cam"?"mem":"cam";this.textContent=srcMode==="cam"?"Источник: камера":"Источник: память";status("Источник: "+(srcMode==="cam"?"камера (визир при проверке)":"память (галерея)")+".");};
$("bReset").onclick=function(){localStorage.removeItem("poryadok_ref");refC=null;curC=null;zones=[];lastBoxes=null;lastRefD=null;lastCurD=null;lastMask=null;$("zones").innerHTML="";var v=$("view");v.getContext("2d").clearRect(0,0,v.width,v.height);$("vcap").textContent="";status("Эталон сброшен. Источник: "+(srcMode==="cam"?"камера":"память")+". Нажмите «1. Эталон».");};
$("bRot").onclick=function(){visRot=(visRot+1)%4;};
$("zoom").oninput=function(){visZoom=+this.value/100;$("zoomv").textContent=visZoom.toFixed(1);};
$("bCam").onclick=function(){
 navigator.mediaDevices.enumerateDevices().then(function(ds){
  var vids=ds.filter(function(d){return d.kind==="videoinput";});
  if(vids.length<2){$("hint").textContent="На этом телефоне камера одна";return;}
  camIdx=(camIdx+1)%vids.length;
  var id=vids[camIdx].deviceId;
  stopVisor();
  startVisor(id);
 });
};
$("sMinus").onclick=function(){THR=Math.max(15,THR-1);$("sens").value=THR;$("sensv").textContent=THR;if(refC&&curC)compare();};
$("sPlus").onclick=function(){THR=Math.min(60,THR+1);$("sens").value=THR;$("sensv").textContent=THR;if(refC&&curC)compare();};
$("fRefCam").onchange=function(){var f=this.files[0];this.value="";if(f)fileToImage(f).then(function(im){setRefCanvas(toCanvas(im,1200));});};
$("fRefMem").onchange=function(){var f=this.files[0];this.value="";if(f)fileToImage(f).then(function(im){showPreview(im,"ref",function(){$("fRefMem").click();});});};
$("fCurCam").onchange=function(){var f=this.files[0];this.value="";if(f)fileToImage(f).then(function(im){setCurCanvas(toCanvas(im,1200));});};
$("fCurMem").onchange=function(){var f=this.files[0];this.value="";if(f)fileToImage(f).then(function(im){showPreview(im,"cur",function(){$("fCurMem").click();});});};
$("sens").oninput=function(){THR=+this.value;$("sensv").textContent=this.value;if(refC&&curC)compare();};
var tsx=0,tsy2=0;
$("view").addEventListener("touchstart",function(e){tsx=e.touches[0].clientX;tsy2=e.touches[0].clientY;},{passive:true});
$("view").addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy2;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){showRef=!showRef;drawView();}},{passive:true});
$("view").addEventListener("click",function(){if(lastRefD){showRef=!showRef;drawView();}});
(function(){
 var d=null;try{d=localStorage.getItem("poryadok_ref");}catch(e){}
 if(d){var im=new Image();im.onload=function(){refC=toCanvas(im,1200);status("Эталон загружен из памяти. Можно сразу «2. Проверка».");};im.src=d;}
})();
</script>
