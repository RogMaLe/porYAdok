<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПорЯдок 2.2</title>
<style>
 body{font-family:sans-serif;margin:0;background:#1c1b18;color:#eee}
 header{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;background:#2a2823}
 header b{font-size:20px}
 .bar{display:flex;gap:6px;padding:8px;flex-wrap:wrap;justify-content:center}
 button{font-size:16px;padding:12px 14px;border:0;border-radius:10px;background:#3d6b35;color:#fff}
 button.alt{background:#5a4a22}
 #status{padding:8px;text-align:center;color:#ffd76a;min-height:22px}
 .srow{display:flex;justify-content:center;align-items:center;gap:8px;padding:4px;color:#bbb;font-size:14px}
 #view{display:block;width:100%;background:#000;touch-action:pan-y}
 #vcap{text-align:center;color:#888;font-size:13px;padding:4px}
 #zones{padding:8px}
 .zone{background:#2a2823;border-radius:12px;padding:8px;margin:10px 0;border:3px solid #c0392b}
 .zone.edge{border-color:#e67e22}
 .zone.ok{border-color:#3d6b35}
 .zone .t{font-size:16px;margin-bottom:6px;font-weight:bold}
 .pair{display:flex;gap:8px;align-items:flex-start}
 .pair figure{margin:0;text-align:center}
 .pair canvas{border-radius:8px;background:#000;max-width:46vw}
 .pair figcaption{font-size:12px;color:#aaa}
 .evi img{border-radius:8px;max-width:46vw;margin-top:6px}
 .evi .cap{font-size:12px;color:#9f9}
 #visor{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
 #vwrap{position:relative;flex:1;overflow:hidden}
 #vid{width:100%;height:100%;object-fit:cover}
 #ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
 .vbar{padding:8px;background:#2a2823;display:flex;flex-direction:column;gap:6px}
 #hint{text-align:center;font-size:18px;color:#ffd76a;min-height:24px}
 #hint.good{color:#7fe07f}
 #hint.bad{color:#ff8080;font-size:20px}
</style>
</head>
<body>
<header>
<svg width="46" height="46" viewBox="0 0 100 100">
 <line x1="36" y1="60" x2="12" y2="90" stroke="#111" stroke-width="13"/>
 <circle cx="56" cy="40" r="30" fill="#fff" stroke="#111" stroke-width="11"/>
 <text x="45" y="52" font-size="36" font-weight="bold" font-family="sans-serif" fill="#33339f" text-anchor="middle">Я</text>
 <text x="66" y="52" font-size="36" font-weight="bold" font-family="sans-serif" fill="#009444" text-anchor="middle">R</text>
 <line x1="46" y1="58" x2="42" y2="66" stroke="#d22" stroke-width="6" stroke-linecap="round"/>
 <line x1="63" y1="58" x2="67" y2="66" stroke="#d22" stroke-width="6" stroke-linecap="round"/>
</svg>
<b>ПорЯдок 2.2 «Детектив»</b>
</header>
<div class="bar">
 <button id="bRef">1. Эталон</button>
 <button id="bCur">2. Проверка</button>
 <button id="bGo" class="alt">Сравнить</button>
 <button id="bSrc" class="alt">Источник: камера</button>
 <button id="bReset" class="alt">Сброс</button>
</div>
<div class="srow">Строгость: <input type="range" id="sens" min="15" max="60" value="30"> <span id="sensv">30</span> (выше — меньше тревог)</div>
<div id="status">Эталон не задан. Нажмите «1. Эталон». Источник переключается кнопкой «Источник».</div>
<canvas id="view"></canvas>
<div id="vcap"></div>
<div id="zones"></div>
<div id="visor">
 <div id="vwrap"><video id="vid" autoplay playsinline muted></video><canvas id="ovl"></canvas></div>
 <div class="vbar">
  <div class="srow">Прозрачность эталона: <input type="range" id="alpha" min="0" max="100" value="45"></div>
  <div class="srow"><input type="checkbox" id="autoshot"> Автокадр при совмещении</div>
  <div id="hint">Совмещаем…</div>
  <div class="bar">
   <button id="bShot">Снять кадр</button>
   <button id="bCancel" class="alt">Отмена</button>
  </div>
 </div>
</div>
<input type="file" id="fRefCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fRefMem" accept="image/*" hidden>
<input type="file" id="fCurCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fCurMem" accept="image/*" hidden>
<input type="file" id="fEvi" accept="image/*" hidden>
<script>
"use strict";
var THR=30, MINFRAC=0.0025, DW=800, LS=192;
function $(id){return document.getElementById(id);}
var refC=null,curC=null,zones=[],eviZone=-1,srcMode="cam";
var lastBoxes=null,lastRefD=null,lastCurD=null,lastF=1,showRef=false,stream=null,hintTimer=null,rafId=null,shotDone=false;

function fileToImage(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f);var im=new Image();im.onload=function(){res(im);};im.onerror=rej;im.src=u;});}
function toCanvas(src,maxW){var w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;var s=Math.min(1,maxW/w);var c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c;}
function grayOf(c){var d=c.getContext("2d").getImageData(0,0,c.width,c.height).data;var g=new Float32Array(c.width*c.height);for(var i=0,p=0;i<d.length;i+=4,p++){g[p]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];}return g;}
function grayAt(c,W,H){var t=document.createElement("canvas");t.width=W;t.height=H;t.getContext("2d").drawImage(c,0,0,W,H);return grayOf(t);}
function status(t){$("status").textContent=t;}
function rot90(c,cw){var o=document.createElement("canvas");o.width=c.height;o.height=c.width;var x=o.getContext("2d");x.translate(o.width/2,o.height/2);x.rotate(cw?Math.PI/2:-Math.PI/2);x.drawImage(c,-c.width/2,-c.height/2);return o;}

function search(rg,cg,W,H,ss,rr,tx0,tx1,tsx,ty0,ty1,tsy){
 var CX=W/2,CY=H/2,lim=W*H,best={s:1,r:0,tx:0,ty:0,score:Infinity};
 for(var si=0;si<ss.length;si++)for(var ri=0;ri<rr.length;ri++)
  for(var tx=tx0;tx<=tx1;tx+=tsx)for(var ty=ty0;ty<=ty1;ty+=tsy){
   var a=rr[ri]*Math.PI/180,co=Math.cos(a),sin=Math.sin(a);
   var A00=ss[si]*co,A01=-ss[si]*sin,A10=ss[si]*sin,A11=ss[si]*co;
   var b0=CX-(A00*CX+A01*CY)+tx,b1=CY-(A10*CX+A11*CY)+ty;
   var sum=0,cnt=0;
   for(var y=0;y<H;y++)for(var x=0;x<W;x++){
    var dx=x-CX,dy=y-CY;
    var px=Math.round(A00*dx+A01*dy+b0),py=Math.round(A10*dx+A11*dy+b1);
    if(px<0||py<0||px>=W||py>=H)continue;
    sum+=Math.abs(cg[py*W+px]-rg[y*W+x]);cnt++;
   }
   if(cnt<0.6*lim)continue;
   var sc=sum/cnt;
   if(sc<best.score)best={s:ss[si],r:rr[ri],tx:tx,ty:ty,score:sc};
  }
 return best;
}
function findAlign(rC,cC,deep){
 var LW=96,LH=Math.max(48,Math.round(96*rC.height/rC.width));
 var rg=grayAt(rC,LW,LH),cg=grayAt(cC,LW,LH);
 var b1=search(rg,cg,LW,LH,[0.85,0.92,1.0,1.08,1.15],[-6,-3,0,3,6],-16,16,4,-12,12,3);
 if(b1.score===Infinity)return{s:1,r:0,txu:0,tyu:0,score:Infinity};
 var H2=Math.round(LS*LH/LW);
 var rg2=grayAt(rC,LS,H2),cg2=grayAt(cC,LS,H2);
 var b2=search(rg2,cg2,LS,H2,[b1.s-0.02,b1.s,b1.s+0.02],[b1.r-1.5,b1.r,b1.r+1.5],Math.round(b1.tx*2)-4,Math.round(b1.tx*2)+4,2,Math.round(b1.ty*2)-4,Math.round(b1.ty*2)+4,2);
 if(!deep)return{s:b2.s,r:b2.r,txu:b2.tx/LS,tyu:b2.ty/LS,score:b2.score};
 var L3=384,H3=Math.round(L3*LH/LW);
 var rg3=grayAt(rC,L3,H3),cg3=grayAt(cC,L3,H3);
 var b3=search(rg3,cg3,L3,H3,[b2.s-0.01,b2.s,b2.s+0.01],[b2.r-0.5,b2.r,b2.r+0.5],Math.round(b2.tx*2)-2,Math.round(b2.tx*2)+2,1,Math.round(b2.ty*2)-2,Math.round(b2.ty*2)+2,1);
 return{s:b3.s,r:b3.r,txu:b3.tx/L3,tyu:b3.ty/L3,score:b3.score};
}
function warpRender(cC,W,refAspect,al){
 var H=Math.round(W*refAspect);
 var c=document.createElement("canvas");c.width=W;c.height=H;
 var ctx=c.getContext("2d");ctx.fillStyle="#777";ctx.fillRect(0,0,W,H);
 var sc=toCanvas(cC,W);
 var a=al.r*Math.PI/180,co=Math.cos(a),sin=Math.sin(a);
 var A00=al.s*co,A01=-al.s*sin,A10=al.s*sin,A11=al.s*co;
 var CX=W/2,CY=H/2,tx=al.txu*W,ty=al.tyu*W;
 var b0=CX-(A00*CX+A01*CY)+tx,b1=CY-(A10*CX+A11*CY)+ty;
 var P00=co/al.s,P01=sin/al.s,P10=-sin/al.s,P11=co/al.s;
 var q0=-(P00*b0+P01*b1),q1=-(P10*b0+P11*b1);
 ctx.setTransform(P00,P10,P01,P11,q0,q1);
 ctx.drawImage(sc,0,0);
 ctx.setTransform(1,0,0,1,0,0);
 return c;
}
function blur3(m,W,H){var t=new Float32Array(m.length),o=new Float32Array(m.length);var x,y,i,j;
 for(y=0;y<H;y++)for(x=0;x<W;x++){var s=0,c=0;for(i=-1;i<2;i++){var xx=x+i;if(xx<0||xx>=W)continue;s+=m[y*W+xx];c++;}t[y*W+x]=s/c;}
 for(y=0;y<H;y++)for(x=0;x<W;x++){var s2=0,c2=0;for(j=-1;j<2;j++){var yy=y+j;if(yy<0||yy>=H)continue;s2+=t[yy*W+x];c2++;}o[y*W+x]=s2/c2;}
 return o;}
function erode(m,W,H){var o=new Uint8Array(W*H);for(var y=0;y<H;y++)for(var x=0;x<W;x++){var v=1;for(var dy=-1;dy<2&&v;dy++)for(var dx=-1;dx<2;dx++){var yy=y+dy,xx=x+dx;var val=(yy<0||xx<0||yy>=H||xx>=W)?0:m[yy*W+xx];if(!val){v=0;break;}}o[y*W+x]=v;}return o;}
function dilate(m,W,H){var o=new Uint8Array(W*H);for(var y=0;y<H;y++)for(var x=0;x<W;x++){var v=0;for(var dy=-1;dy<2&&!v;dy++)for(var dx=-1;dx<2;dx++){var yy=y+dy,xx=x+dx;if(yy<0||xx<0||yy>=H||xx>=W)continue;if(m[yy*W+xx]){v=1;break;}}o[y*W+x]=v;}return o;}
function components(mask,W,H,minArea){
 var seen=new Uint8Array(W*H),out=[],stack=[];
 for(var y=0;y<H;y++)for(var x=0;x<W;x++){
  var idx=y*W+x;
  if(!mask[idx]||seen[idx])continue;
  stack.length=0;stack.push(idx);seen[idx]=1;
  var minx=x,maxx=x,miny=y,maxy=y,area=0;
  while(stack.length){
   var p=stack.pop(),px=p%W,py=(p/W)|0;area++;
   if(px<minx)minx=px;if(px>maxx)maxx=px;if(py<miny)miny=py;if(py>maxy)maxy=py;
   for(var d=0;d<4;d++){
    var nx=px+(d===0?1:d===1?-1:0),ny=py+(d===2?1:d===3?-1:0);
    if(nx<0||ny<0||nx>=W||ny>=H)continue;
    var ni=ny*W+nx;
    if(mask[ni]&&!seen[ni]){seen[ni]=1;stack.push(ni);}
   }
  }
  if(area>=minArea)out.push({x:minx,y:miny,w:maxx-minx+1,h:maxy-miny+1,area:area});
 }
 return out;
}
function thumb(src,box,f){
 var c=document.createElement("canvas");
 var sw=box.w*f,sh=box.h*f,sx=box.x*f,sy=box.y*f;
 var tw=150,th=Math.max(40,Math.min(260,Math.round(150*sh/sw)));
 c.width=tw;c.height=th;
 c.getContext("2d").drawImage(src,sx,sy,sw,sh,0,0,tw,th);
 return c;
}
function drawView(){
 if(!lastRefD||!lastCurD)return;
 var view=$("view"),ctx=view.getContext("2d");
 if(showRef){ctx.drawImage(lastRefD,0,0);$("vcap").textContent="Кадр 1 (эталон). Свайп или тап — вернуться к результату.";}
 else{
  ctx.drawImage(lastCurD,0,0);
  for(var i=0;i<lastBoxes.length;i++){
   var b=lastBoxes[i];
   ctx.strokeStyle=b.edge?"#e67e22":"#ff2222";ctx.lineWidth=4;
   ctx.strokeRect(b.x*lastF,b.y*lastF,b.w*lastF,b.h*lastF);
   ctx.fillStyle=b.edge?"#e67e22":"#ff2222";ctx.font="bold 34px sans-serif";
   ctx.fillText(String(i+1),b.x*lastF+6,Math.max(34,b.y*lastF+34));
  }
  $("vcap").textContent="Кадр 2 с зонами. Свайп или тап — показать эталон.";
 }
}
function compare(){
 if(!refC){status("Сначала задайте эталон: кнопка «1. Эталон».");return;}
 if(!curC){status("Сначала получите проверку: кнопка «2. Проверка».");return;}
 status("Сравниваю… секундочку.");
 setTimeout(function(){
  try{
   var refAspect=refC.height/refC.width;
   var curWork=curC;
   var curAspect=curC.height/curC.width;
   if((refAspect>1)!==(curAspect>1)){
    var c1=rot90(curC,true),c2=rot90(curC,false);
    var a1=findAlign(refC,c1,false),a2=findAlign(refC,c2,false);
    if(a1.score<=a2.score)curWork=c1;else curWork=c2;
   }
   var al=findAlign(refC,curWork,true);
   var aligned=true;
   if(al.score===Infinity){al={s:1,r:0,txu:0,tyu:0};aligned=false;}
   var MW=320,MH=Math.round(MW*refAspect);
   var g1=grayAt(refC,MW,MH);
   var g2=grayOf(warpRender(curWork,MW,refAspect,al));
   var m1=0,m2=0,i;
   for(i=0;i<g1.length;i++){m1+=g1[i];m2+=g2[i];}
   m1/=g1.length;m2/=g2.length;
   var s1=0,s2=0;
   for(i=0;i<g1.length;i++){s1+=(g1[i]-m1)*(g1[i]-m1);s2+=(g2[i]-m2)*(g2[i]-m2);}
   s1=Math.sqrt(s1/g1.length);s2=Math.sqrt(s2/g2.length);
   var g2n=new Float32Array(g2.length);
   for(i=0;i<g2.length;i++){g2n[i]=Math.max(0,Math.min(255,(g2[i]-m2)*(s1/Math.max(s2,0.001))+m1));}
   var diff=new Float32Array(g1.length);
   for(i=0;i<diff.length;i++)diff[i]=Math.abs(g1[i]-g2n[i]);
   diff=blur3(diff,MW,MH);
   var mask=new Uint8Array(MW*MH);
   for(i=0;i<mask.length;i++)mask[i]=diff[i]>THR?1:0;
   mask=erode(mask,MW,MH);mask=dilate(mask,MW,MH);
   mask=dilate(mask,MW,MH);mask=erode(mask,MW,MH);
   var boxes=components(mask,MW,MH,Math.round(MINFRAC*MW*MH));
   for(i=0;i<boxes.length;i++){
    var bb=boxes[i];
    bb.edge=(bb.x<=1||bb.y<=1||bb.x+bb.w>=MW-2||bb.y+bb.h>=MH-2);
   }
   boxes.sort(function(a,b){return b.area-a.area;});
   lastCurD=warpRender(curWork,DW,refAspect,al);
   lastRefD=toCanvas(refC,DW);
   lastBoxes=boxes;lastF=DW/MW;showRef=false;
   var view=$("view");view.width=DW;view.height=Math.round(DW*refAspect);
   drawView();
   zones=[];$("zones").innerHTML="";
   for(var zi=0;zi<boxes.length;zi++)addZone(zi+1,boxes[zi],lastRefD,lastCurD,lastF);
   if(boxes.length===0&&aligned)status("Изменений не найдено. Порядок идеальный.");
   else if(boxes.length===0&&!aligned)status("Совместить кадры не удалось и явных изменений не видно. Гарантировать порядок не могу. Переснимите ближе к точке эталона.");
   else status("Зон изменений: "+boxes.length+(aligned?". Ниже — было/стало по каждой.":". Кадры не совместились точно — зоны приблизительные; оранжевые у края кадра наименее надёжны."));
  }catch(e){status("Ошибка сравнения: "+e.message);}
 },60);
}
function addZone(n,b,refD,curD,f){
 var div=document.createElement("div");div.className="zone"+(b.edge?" edge":"");
 var t=document.createElement("div");t.className="t";t.textContent="Зона "+n+": изменено"+(b.edge?" (у края кадра)":"");
 var pair=document.createElement("div");pair.className="pair";
 var f1=document.createElement("figure");f1.appendChild(thumb(refD,b,f));var c1=document.createElement("figcaption");c1.textContent="было (эталон)";f1.appendChild(c1);
 var f2=document.createElement("figure");f2.appendChild(thumb(curD,b,f));var c2=document.createElement("figcaption");c2.textContent="стало";f2.appendChild(c2);
 pair.appendChild(f1);pair.appendChild(f2);
 var btn=document.createElement("button");btn.textContent="Приложить вещдок";
 btn.onclick=function(){eviZone=n-1;$("fEvi").click();};
 var evi=document.createElement("div");evi.className="evi";
 div.appendChild(t);div.appendChild(pair);div.appendChild(btn);div.appendChild(evi);
 $("zones").appendChild(div);
 zones.push({el:div,t:t});
}
function stopVisor(){
 if(hintTimer){clearInterval(hintTimer);hintTimer=null;}
 if(rafId){cancelAnimationFrame(rafId);rafId=null;}
 if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
 $("visor").style.display="none";
}
function doShot(){
 var vid2=$("vid");
 var c=document.createElement("canvas");c.width=vid2.videoWidth;c.height=vid2.videoHeight;
 c.getContext("2d").drawImage(vid2,0,0);
 curC=toCanvas(c,1200);
 stopVisor();
 status("Проверка получена. Сравниваю…");
 compare();
}
function startVisor(){
 if(!refC){status("Сначала задайте эталон.");return;}
 shotDone=false;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status("Визир недоступен здесь, снимаю обычно.");$("fCurCam").click();return;}
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}}).then(function(st){
  stream=st;
  var vid=$("vid");vid.srcObject=st;
  $("visor").style.display="flex";
  vid.onloadedmetadata=function(){
   var ovl=$("ovl"),wrap=$("vwrap");
   ovl.width=wrap.clientWidth;ovl.height=wrap.clientHeight;
   var refHW=refC.height/refC.width;
   var vidHW=vid.videoHeight/vid.videoWidth;
   var mismatch=(refHW>1)!==(vidHW>1);
   var loop=function(){
    var ctx=ovl.getContext("2d");
    ctx.clearRect(0,0,ovl.width,ovl.height);
    ctx.globalAlpha=$("alpha").value/100;
    var sc=Math.min(ovl.width/refC.width,ovl.height/refC.height);
    var dw=refC.width*sc,dh=refC.height*sc;
    ctx.drawImage(refC,(ovl.width-dw)/2,(ovl.height-dh)/2,dw,dh);
    ctx.globalAlpha=1;
    rafId=requestAnimationFrame(loop);
   };
   loop();
   var fc=document.createElement("canvas");
   hintTimer=setInterval(function(){
    var h=$("hint");
    if(!vid.videoWidth)return;
    if(mismatch){h.className="bad";h.textContent=refHW>1?"Эталон снят ГОРИЗОНТАЛЬНО — поверните телефон горизонтально":"Эталон снят ВЕРТИКАЛЬНО — поверните телефон вертикально";return;}
    fc.width=320;fc.height=Math.round(320*vid.videoHeight/vid.videoWidth);
    fc.getContext("2d").drawImage(vid,0,0,fc.width,fc.height);
    var al=findAlign(refC,fc,false);
    var parts=[];
    if(al.score===Infinity){h.className="";h.textContent="Наведите на ту же сцену";return;}
    if(al.txu>0.02)parts.push("→ право");else if(al.txu<-0.02)parts.push("← лево");
    if(al.tyu>0.02)parts.push("↓ низ");else if(al.tyu<-0.02)parts.push("↑ верх");
    if(al.s<0.85)parts.push("сильно ближе");else if(al.s>1.15)parts.push("сильно дальше");
    if(parts.length===0){h.className="good";h.textContent="✓ совмещено, снимайте!";if($("autoshot").checked&&!shotDone){shotDone=true;doShot();}}
    else{h.className="";h.textContent=parts.join(", ");}
   },700);
  };
  $("bShot").onclick=doShot;
  $("bCancel").onclick=function(){stopVisor();status("Визир отменён. Источник: "+(srcMode==="cam"?"камера":"память")+".");};
 }).catch(function(){
  status("Камера не открылась визиром, снимаю обычно.");
  $("fCurCam").click();
 });
}
$("fEvi").onchange=function(){
 var f=this.files[0];this.value="";
 if(f==null||eviZone<0||!zones[eviZone])return;
 var z=zones[eviZone];
 fileToImage(f).then(function(im){
  var img=document.createElement("img");img.src=toCanvas(im,400).toDataURL("image/jpeg",0.8);
  var cap=document.createElement("div");cap.className="cap";cap.textContent="вещдок приложен: обстоятельство объяснено";
  z.el.classList.add("ok");
  z.t.textContent=z.t.textContent.replace("изменено","объяснено");
  var evi=z.el.querySelector(".evi");evi.appendChild(img);evi.appendChild(cap);
  status("Зона "+(eviZone+1)+" помечена как объяснённая.");
 });
};
function setRef(im){refC=toCanvas(im,1200);try{localStorage.setItem("poryadok_ref",toCanvas(im,1024).toDataURL("image/jpeg",0.85));}catch(e){}status("Эталон сохранён. Теперь «2. Проверка». Источник: "+(srcMode==="cam"?"камера":"память")+".");}
function setCur(im){curC=toCanvas(im,1200);status("Проверка получена. Жмите «Сравнить».");}
$("bRef").onclick=function(){(srcMode==="cam"?$("fRefCam"):$("fRefMem")).click();};
$("bCur").onclick=function(){if(srcMode==="cam")startVisor();else $("fCurMem").click();};
$("bGo").onclick=compare;
$("bSrc").onclick=function(){srcMode=srcMode==="cam"?"mem":"cam";this.textContent=srcMode==="cam"?"Источник: камера":"Источник: память";status("Источник: "+(srcMode==="cam"?"камера (визир при проверке)":"память (галерея)")+".");};
$("bReset").onclick=function(){localStorage.removeItem("poryadok_ref");refC=null;curC=null;zones=[];lastBoxes=null;lastRefD=null;lastCurD=null;$("zones").innerHTML="";var v=$("view");v.getContext("2d").clearRect(0,0,v.width,v.height);$("vcap").textContent="";status("Эталон сброшен. Источник: "+(srcMode==="cam"?"камера":"память")+". Нажмите «1. Эталон».");};
$("fRefCam").onchange=function(){var f=this.files[0];this.value="";if(f)fileToImage(f).then(setRef);};
$("fRefMem").onchange=function(){var f=this.files[0];this.value="";if(f)fileToImage(f).then(setRef);};
$("fCurCam").onchange=function(){var f=this.files[0];this.value="";if(f)fileToImage(f).then(setCur);};
$("fCurMem").onchange=function(){var f=this.files[0];this.value="";if(f)fileToImage(f).then(setCur);};
$("sens").oninput=function(){THR=+this.value;$("sensv").textContent=this.value;if(refC&&curC)compare();};
var tsx=0,tsy2=0;
$("view").addEventListener("touchstart",function(e){tsx=e.touches[0].clientX;tsy2=e.touches[0].clientY;},{passive:true});
$("view").addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy2;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){showRef=!showRef;drawView();}},{passive:true});
$("view").addEventListener("click",function(){if(lastRefD){showRef=!showRef;drawView();}});
(function(){
 var d=null;try{d=localStorage.getItem("poryadok_ref");}catch(e){}
 if(d){var im=new Image();im.onload=function(){refC=toCanvas(im,1200);status("Эталон загружен из памяти. Можно сразу «2. Проверка».");};im.src=d;}
})();
</script>
